# 备案期 ingress：
#   game.sgweb.asia —— 完整游戏站点（前端+API 同源，隧道直达容器内 nginx）
#   api.sgweb.asia  —— 纯 API（外部构建的前端如 workers.dev 使用）
#   其余主机名（含 sgweb.asia 主域名）—— 一律 404，保持"网站关闭"态
ingress:
  - hostname: game.sgweb.asia
    service: http://127.0.0.1:8080
  - hostname: api.sgweb.asia
    service: http://127.0.0.1:8080
  - service: http_status:404
