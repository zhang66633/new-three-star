events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ════════════════════════════════════════════════════════
    # 备案期关闭配置（2026-08-16）：域名不再对外提供任何 Web 内容
    # 恢复方式：还原 /data/nginx/conf/nginx.conf.bak.20260816 后
    #   docker exec nginx-ssl nginx -s reload
    # ════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name sgweb.asia www.sgweb.asia;

        ssl_certificate     /etc/nginx/ssl/sgweb.asia.crt;
        ssl_certificate_key /etc/nginx/ssl/sgweb.asia.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 备案期：直接关闭连接（不返回任何内容）
        return 444;
    }

    server {
        listen 80 default_server;
        server_name _;

        # 备案期：任何主机名（含 IP 直连）一律关闭连接
        return 444;
    }
}
